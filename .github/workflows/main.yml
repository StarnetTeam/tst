name: Build ApplicationLoopback

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: cmd
        run: |
          nuget restore loopback\helper\packages.config ^
            -PackagesDirectory loopback\helper\packages ^
            -NonInteractive

      - name: Build ApplicationLoopback
        shell: cmd
        run: |
          msbuild loopback\helper\ApplicationLoopback.vcxproj ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:RestorePackagesConfig=false

      - name: Find generated executable
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Filter ApplicationLoopback.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ApplicationLoopback-x64
          path: '**/ApplicationLoopback.exe'
